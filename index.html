document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

if>\n\n    <sc-if value=\"{{ isWatch }}\">\n      <div data-screen-label=\"Watchlist\" style=\"flex:1;display:flex;align-items:flex-start;min-width:0\">\n        <nav style=\"width:260px;flex:none;position:sticky;top:69px;max-height:calc(100vh - 69px);overflow-y:auto;border-right:1px solid #e4ddcc;padding:14px 10px 24px;display:flex;flex-direction:column;gap:12px;background:#f9f6ef\">\n          <span style=\"font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#a4843a;padding:0 8px\">Measures<\u002Fspan>\n          <sc-for list=\"{{ rail }}\" as=\"g\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;flex-direction:column;gap:1px\">\n              <span style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#6f6a5b;padding:2px 8px 4px\">{{ g.name }}<\u002Fspan>\n              <sc-for list=\"{{ g.items }}\" as=\"it\">\n                <button sc-camel-on-click=\"{{ it.go }}\" title=\"{{ it.st }}\" style=\"{{ it.s }}\">\n                  <span style=\"{{ it.glyph }}\"><\u002Fspan>\n                  <span style=\"flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ it.name }}<\u002Fspan>\n                  <span style=\"{{ it.tagS }}\">{{ it.tag }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fnav>\n        <main style=\"flex:1;min-width:0;padding:18px 22px 40px\">\n          <div style=\"display:flex;flex-direction:column;gap:14px;width:100%\">\n            <sc-if value=\"{{ L.std }}\"><div style=\"background:#ffffff;border:1px solid #e4ddcc;border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:22px;align-items:end\">\n              <div style=\"display:flex;flex-direction:column;gap:7px\">\n                <span style=\"font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight ection:column;gap:12px\">\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <span style=\"font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#a4843a\">Ranked by<\u002Fspan>\n                  <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n                    <span style=\"font-family:'Playfair Display',serif;font-size:24px;font-weight:700;line-height:1.15\">Class 4 (pokie) grants cross-reference, period-aligned<\u002Fspan>\n                    <span style=\"font-size:10px;font-weight:600;letter-spacing:.1em;color:#4a4536;border:1px solid #4a4536;border-radius:4px;padding:1px 6px\">EXTERNAL<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ toggleMeth }}\" title=\"Methodology\" style=\"{{ methBtnS }}\">i<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-size:13px;color:#2b2820;text-wrap:pretty\"><span style=\"font-family:'JetBrains Mono',monospace\">3,151<\u002Fspan> registered charities join DIA’s Class 4 grants data by <strong>exact normalised name<\u002Fstrong>; <span style=\"font-family:'JetBrains Mono',monospace\">1,805<\u002Fspan> have positive net grants inside their own latest reporting period. Comparing those period-aligned grants against the same return:<\u002Fspan>\n                <div style=\"display:flex;flex-direction:column\">\n                  <sc-for list=\"{{ pk }}\" as=\"t\">\n                    <button sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.s }}\">\n                      <span style=\"font-family:'Playfair Display',serif;font-size:24px;font-weight:700;line-height:1;min-width:50px\">{{ t.n }}<\u002Fspan>\n                      <span style=\"{{ t.chipS }}\">{{ t.tier }}<\u002Fspan>\n                      <span style=\"flex:1 1 300px;font-size:13px;line-height:1.45;text-wrap:pretty\">{{ t.pre }}<strong>{{ t.bold }}<\u002Fstrong>{{ t.post }} <span style=\"color:#6f6a5b;font-size:12px\">· sensitivity {{ t.sens }}<\u002Fspan><\u002Fspan>\n                      <span style=\"{{ t.tagS }}\">{{ t.tag }}<\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <sc-if value=\"{{ methOpen }}\"><div style=\"display:flex;flex-direction:column;gap:8px;border-top:1px solid #eee8da;padding-top:12px;font-size:12px;line-height:1.55;color:#6f6a5b;text-wrap:pretty\">\n                  <span><strong style=\"color:#4a4536\">Methodology.<\u002Fstrong> Each accepted grant is mapped into the charity’s own reporting period by its balance date (YearEnded); refunds are netted at the refund date (or the grant date when undated). Exact-normalised name matches only — candidate-tier matches are excluded here. <strong style=\"color:#4a4536\">91 group-registered charities are excluded<\u002Fstrong>: group returns consolidate income across members, so an entity-level comparison is not meaningful. Tiers count only charities whose return reports the relevant denominator. Sensitivity re-runs the comparison with each charity’s grant window shifted one period earlier and later; the wide ranges show how timing-fragile these observations are.<\u002Fspan>\n                  <span><strong style=\"color:#4a4536\">Reading Tiers B/C:<\u002Fstrong> the manual spot-check found most exceedances are returns where the granular grant lines are blank or zero while total income is substantial, often line-item completion rather than understatement; <strong style=\"color:#4a4536\">Tier A is the robust tier<\u002Fstrong> (total gross income is near-universally reported). These are <strong style=\"color:#4a4536\">candidate consistency observations, not failures<\u002Fstrong>: timing differences (accruals, multi-year projects) legitimately explain many, and each case surfaces on the charity’s Entity 360 for an analyst to reconcile.<\u002Fspan>\n                  <span style=\"font-style:italic\">Source: DIA Grants from Gaming Machine Profits, CC BY 4.0, 2021 onwards.<\u002Fspan>\n                <\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n              <div style=\"display:flex;gap:3px;background:#efe9dc;border-radius:999px;padding:3px\"><sc-for list=\"{{ tiers }}\" as=\"t\"><button sc-camel-on-click=\"{{ t.set }}\" style=\"{{ t.s }}\">{{ t.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n              <sc-if value=\"{{ L.hasTh }}\"><button sc-camel-on-click=\"{{ toggleOver }}\" style=\"{{ overS }}\">{{ overLabel }}<\u002Fbutton><\u002Fsc-if>\n              <span style=\"margin-left:auto;font-size:11.5px;color:#6f6a5b\">{{ L.countLine }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#ffffff;border:1px solid #e4ddcc;border-radius:10px;overflow:hidden\">\n              <div style=\"display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid #e4ddcc;background:#fcfbf8;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:#6f6a5b\">\n                <span style=\"width:34px\">#<\u002Fspan><span style=\"flex:1\">Charity<\u002Fspan><span style=\"width:110px;text-align:right\">{{ L.short }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ L.rows }}\" as=\"w\" hint-placeholder-count=\"14\">\n                <sc-if value=\"{{ w.gap }}\"><div style=\"padding:3px 16px;font-size:11px;color:#9a9484;border-bottom:1px solid #f2efe8\">⋮<\u002Fdiv><\u002Fsc-if>\n                <div sc-camel-on-click=\"{{ w.open }}\" style=\"{{ w.s }}\" style-hover=\"background:#f8f6f1\">\n                  <span style=\"width:34px;flex:none;font-size:11.5px;color:#9a9484;font-variant-numeric:tabular-nums\">{{ w.rank }}<\u002Fspan>\n                  <span style=\"flex:1;min-width:0;display:flex;flex-direction:column\"><span style=\"font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ w.name }}<\u002Fspan><span style=\"font-size:10.5px;color:#6f6a5b\">{{ w.meta }}<\u002Fspan><\u002Fspan>\n                  <span style=\"width:110px;flex:none;display:flex;justify-content:flex-end\"><span style=\"{{ w.valS }}\">{{ w.val }}<\u002Fspan><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fmain>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isEntity }}\">\n      <main data-screen-label=\"Entity 360\" style=\"padding:18px 22px 40px\">\n        <div style=\"display:flex;flex-direction:column;gap:14px;max-width:1380px;margin:0 auto;width:100%\">\n          <div style=\"position:relative;max-width:560px;width:100%\">\n            <div style=\"display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;background:#ffffff;border:1px solid #d9d1bf;border-radius:10px\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#6f6a5b\" stroke-width=\"1.6\"><circle cx=\"7\" cy=\"7\" r=\"5\"><\u002Fcircle><line x1=\"11\" y1=\"11\" x2=\"14.5\" y2=\"14.5\"><\u002Fline><\u002Fsvg>\n              <input value=\"{{ q }}\" sc-camel-on-change=\"{{ onQ }}\" placeholder=\"Find a charity by name or CC number\" style=\"flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:13px;color:#2b2820\">\n              <sc-if value=\"{{ hasQ }}\"><button sc-camel-on-click=\"{{ clearQ }}\" style=\"border:none;background:none;cursor:pointer;color:#6f6a5b;font-size:12px;padding:0\">Clear<\u002Fbutton><\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasQ }}\">\n              <div style=\"position:absolute;top:44px;left:0;right:0;z-index:15;background:#ffffff;border:1px solid #d9d1bf;border-radius:10px;box-shadow:0 8px 24px rgba(60,50,30,.14);overflow:hidden\">\n                <sc-for list=\"{{ results }}\" as=\"rs\" hint-placeholder-count=\"3\">\n an style=\"opacity:.85\">{{ E.countPct }}<\u002Fspan><\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start\">\n            <div style=\"display:flex;flex-direction:column;gap:14px;min-width:0\">\n\n              \n              <div style=\"background:#ffffff;border:1px solid #e4ddcc;border-radius:12px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-family:'Playfair Display',serif;font-size:18px;font-weight:700\">Five-year financial trend<\u002Fspan><span style=\"font-size:9.5px;letter-spacing:.1em;font-weight:600;color:#6f6a5b;background:#efe9dc;border-radius:4px;padding:2px 6px\">DECLARED<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:4px\">\n                  <svg sc-camel-view-box=\"0 0 560 190\" style=\"width:100%;height:190px;overflow:visible\">\n                    <line x1=\"20\" y1=\"170\" x2=\"540\" y2=\"170\" stroke=\"#d9d1bf\"><\u002Fline><line x1=\"20\" y1=\"117\" x2=\"540\" y2=\"117\" stroke=\"#efe9dc\"><\u002Fline><line x1=\"20\" y1=\"64\" x2=\"540\" y2=\"64\" stroke=\"#efe9dc\"><\u002Fline><line x1=\"20\" y1=\"11\" x2=\"540\" y2=\"11\" stroke=\"#efe9dc\"><\u002Fline>\n                    <polyline points=\"{{ E.trend.rev }}\" fill=\"none\" stroke=\"#4a4536\" stroke-width=\"2.5\"><\u002Fpolyline>\n                    <polyline points=\"{{ E.trend.exp }}\" fill=\"none\" stroke=\"#a4843a\" stroke-width=\"2.5\"><\u002Fpolyline>\n                    <polyline points=\"{{ E.trend.res }}\" fill=\"none\" stroke=\"#3b5e8c\" stroke-width=\"2.5\"><\u002Fpolyline>\n                  <\u002Fsvg>\n                  <div style=\"display:flex;justify-content:space-between;padding:0 6px;font-size:11px;color:#6f6a5b\"><sc-for list=\"{{ E.trend.years }}\" as=\"yr\"><span>{{ yr }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:16px;font-size:11px;color:#4a4536;flex-wrap:wrap\"><span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"width:18px;height:3px;border-radius:2px;background:#4a4536\"><\u002Fspan>Revenue<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"width:18px;height:3px;border-radius:2px;background:#a4843a\"><\u002Fspan>Expenditure<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"width:18px;height:3px;border-radius:2px;background:#3b5e8c\"><\u002Fspan>Net assets / reserves<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column\">\n                  <div style=\"display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr));gap:8px;padding:8px 10px;background:#f8f6f1;font-size:10px;letter-spacing:.1em;font-weight:600;color:#6f6a5b\"><span>FY<\u002Fspan><span style=\"text-align:right\">REVENUE<\u002Fspan><span style=\"text-align:right\">EXPENSES<\u002Fspan><span style=\"text-align:right\">RESERVES<\u002Fspan><\u002Fdiv>\n                  <sc-for list=\"{{ E.fin }}\" as=\"y\" hint-placeholder-count=\"8\">\n                    <div style=\"display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr));gap:8px;padding:8px 10px;border-bottom:1px solid #eee8da;font-family:'JetBrains Mono',monospace;font-size:11.5px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums\">\n                      <span style=\"color:#2b2820\">{{ y.fy }}<\u002Fspan><span style=\"{{ y.revS }}\">{{ y.rev }}<\u002Fspan><span style=\"{{ y.expS }}\">{{ y.exp }}<\u002Fspan><span style=\"{{ y.resS }}\">{{ y.res }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:#ffffff;border:1px solid #e4ddcc;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:1 bs(v).toFixed(0)+'%',x:v=>v.toFixed(1)+'×',int:v=>String(Math.round(v)),pp:v=>(v>=0?'+':'−')+Math.abs(v).toFixed(0)+' pts',ratio:v=>v.toFixed(2)};\nconst nf=v=>Math.round(v).toLocaleString('en-NZ');\nconst SCALE=24118/240;\nconst POKIE_OFF=true;\nconst METRICS=[\n {id:'overall',group:'All signals',name:'All signals combined',short:'Signals',kind:'combined',status:'live',fmt:'int',dir:'high',lv:[1,3,5],th:3,thLabel:'3 or more',def:'How many risk signals a charity trips at “worth a look” or above. Signals still awaiting statement analysis aren’t counted yet.'},\n {id:'income',group:'Money',name:'Total income',short:'Income',kind:'report',status:'live',fmt:'money',dir:'high',log:true,def:'Total income in the latest annual return.'},\n {id:'incomeChg',group:'Money',name:'Income change, latest year',short:'Change',kind:'report',status:'live',fmt:'spct',dir:'abs',def:'Against the prior-year figure in the same return. Big swings are often one-off grants.'},\n {id:'trading',group:'Activity',name:'Trading share of income',short:'Trading',kind:'report',status:'live',fmt:'pct',dir:'high',def:'Trading and commercial income as a share of total income.'},\n {id:'dormant',group:'Activity',name:'Years of near-zero activity',short:'Years',reason:'Dormant years',kind:'risk',status:'live',fmt:'int',dir:'high',lv:[1,3,5],th:3,thLabel:'3+ of last 5 years',def:'Years in the last five with income and spending under $5,000 and no service-performance quantities.'},\n {id:'accum',group:'Money',name:'Asset growth beyond spending',short:'Gap',reason:'Assets outgrowing spend',kind:'risk',status:'live',fmt:'pp',dir:'high',lv:[15,25,40],th:25,thLabel:'25+ points over 3 years',def:'3-year net-asset growth minus 3-year spending growth. Endowment and restricted funds excluded.'},\n {id:'assetRatio',group:'Money',name:'Assets ÷ annual spending',short:'Ratio',reason:'High assets vs spend',kind:'risk',status:'live',fmt:'x',dir:'high',log:true,lv:[5,8,15],th:8,thLabel:'8× or more',def:'How many years of ,lv:[4,6,9],th:6,thLabel:'6 or more',def:'Consistency failures plus blank required fields on the latest return.'},\n {id:'audit',group:'Reporting & compliance',name:'Modified audit opinions',short:'Opinions',reason:'Modified audit',kind:'risk',status:'live',fmt:'int',dir:'high',lv:[null,1,2],th:1,thLabel:'any in last 3 years',def:'Qualified, adverse or disclaimer. Only audited or reviewed charities can have one.'},\n {off:POKIE_OFF,id:'pokie',group:'Reporting & compliance',name:'Pokie grants exceed declared income',short:'Grants ÷ income',reason:'Pokie grants > income',kind:'risk',status:'external',fmt:'x',dir:'high',lv:[null,1,99],def:'Class 4 (gaming machine) grants, aligned to the charity’s own reporting period, exceed the total gross income on its return. Only Tier A counts toward all signals combined.'},\n {off:POKIE_OFF,id:'pokieBC',group:'Reporting & compliance',name:'Pokie grants vs grant lines (B/C) · not scored',short:'Tier',kind:'report',status:'external',fmt:'tierBC',dir:'high',def:'Class 4 grants exceed the grant lines on the return but not total income. Mostly blank grant lines rather than understatement, so context only.'},\n {id:'overseas',group:'Activity',name:'Share spent overseas',short:'Overseas',kind:'report',status:'partial',fmt:'pct',dir:'high',def:'From the return’s overseas-spend line.'}\n];\nconst GROUPS=['All signals','Money','Activity','Governance','Reporting & compliance'];\nconst MBY={};METRICS.forEach(m=>MBY[m.id]=m);\nconst RISK=METRICS.filter(m=>m.kind==='risk');\nconst PLACES=['Ōtaki','Kāpiti','Waikato','Tauranga Moana','Rotorua','Whakatāne','Ōpōtiki','Tairāwhiti','Napier','Heretaunga','Whanganui','Manawatū','Levin','Wairarapa','Hutt Valley','Porirua','Pōneke','Nelson Bays','Motueka','Marlborough','Kaikōura','Ōtautahi','Timaru','Ōamaru','Dunedin','Mosgiel','Queenstown Lakes','Wānaka','Murihiku','Whangārei','Kaitāia','Ōrewa','Manukau','Tāmaki','Remuera','Kirikiriroa','Te Awamutu','Taupō','Ruapehu','Taranaki','Hāwera','Te Tai Poutini'
